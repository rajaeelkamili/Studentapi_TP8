# ============================================================
#  Student API — Configuration principale
# ============================================================

spring.application.name=studentapi

# Port du serveur embarqué
server.port=8080

# -------------------------------------------------------
# Datasource MySQL
# -------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3308/student_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# -------------------------------------------------------
# JPA / Hibernate
# -------------------------------------------------------
# update : ajuste le schéma d'après les entités (pratique en TP)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# -------------------------------------------------------
# Swagger / OpenAPI
# -------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
